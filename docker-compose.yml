x-backend: &backend
  build: .
  image: steelclub-backend:local
  env_file: .env

services:
  tadb:
    image: postgres:16-alpine
    container_name: steelclub-tadb
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - tadb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  tsdb:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: steelclub-tsdb
    restart: unless-stopped
    env_file: .env
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - tsdb-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  tests:
    <<: *backend
    container_name: steelclub-tests
    restart: "no"
    profiles: ["test"]
    build:
      context: .
      args:
        POETRY_GROUPS: main,dev
    image: steelclub-backend:test
    command: pytest
    depends_on:
      tadb:
        condition: service_healthy
      tsdb:
        condition: service_healthy

  backend:
    <<: *backend
    container_name: steelclub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      tadb:
        condition: service_healthy
      tsdb:
        condition: service_healthy

volumes:
  tadb-data:
  tsdb-data:
